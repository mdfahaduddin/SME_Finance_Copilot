name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Unit and API tests (SQLite, offline LLM)
        run: pytest -q
        env: { APP_ENV: test, OPENAI_API_KEY: "" }

  postgres:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: smecopilot, POSTGRES_USER: smecopilot, POSTGRES_PASSWORD: ci-password }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smecopilot" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://smecopilot:ci-password@localhost:5432/smecopilot
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Models and migrations agree
        run: alembic check
      - name: Downgrade and re-upgrade
        run: alembic downgrade base && alembic upgrade head
      - run: python -m app.cli seed-products
      - name: End-to-end smoke test
        run: python -m scripts.smoke_test

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Frontend tests (Vitest + Testing Library)
        run: npm test
      - name: Typecheck and production build
        run: npm run build
        env: { VITE_DEMO_MODE: "false" }

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - name: Python dependency vulnerabilities
        run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: npm dependency vulnerabilities (high and critical)
        working-directory: frontend
        run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build production images
        run: |
          docker build -t smecopilot-api ./backend
          docker build -t smecopilot-web ./frontend
